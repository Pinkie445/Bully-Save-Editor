<html lang="en">

<title>Bully Save Editor</title>
<meta name="description" content="Free, in-browser save editor for Bully on PS4 (PS2 Classics). Edit money, health, respect, classes, clothes, weapons, collectibles and more - checksum fixed automatically.">
<meta name="theme-color" content="#141f3a">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>/* Bully Save Editor - "Bullworth Academy" theme
   navy blazer tartan, manila folders, report cards and detention-slip yellows */
:root{
  --blazer:#141f3a; --blazer-2:#1c2c52; --blazer-3:#24386a;
  --tartan-g:rgba(34,92,64,.32); --tartan-r:rgba(150,32,32,.22); --tartan-y:rgba(230,180,40,.18);
  --manila:#f1dfae; --manila-d:#d9c084; --paper:#fbf6e8; --paper-2:#f5eedb; --rule:#e2d6b6;
  --ink:#1a2030; --ink-soft:#4a5266; --muted:#7a7f8e;
  --navy:#1c2c52; --crimson:#b52a22; --crimson-d:#7f1913; --gold:#f2b51c; --gold-d:#a77a0a; --green:#2c7a4a;
  --bully-y:#ffd23a;
  --shadow:0 2px 0 rgba(0,0,0,.08), 0 10px 24px rgba(5,10,25,.35);
  --marker:'Permanent Marker','Marker Felt','Segoe Print','Chalkboard SE','Comic Sans MS',system-ui,sans-serif;
  --hand:'Patrick Hand','Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',system-ui,sans-serif;
  --ui:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  color:var(--ink); font:16px/1.45 var(--ui);
  background-color:var(--blazer);
  background-image:
    repeating-linear-gradient(90deg,transparent 0 46px,var(--tartan-y) 46px 48px,transparent 48px 96px),
    repeating-linear-gradient(0deg,transparent 0 46px,var(--tartan-y) 46px 48px,transparent 48px 96px),
    repeating-linear-gradient(90deg,var(--tartan-g) 0 22px,transparent 22px 48px,var(--tartan-r) 48px 56px,transparent 56px 96px),
    repeating-linear-gradient(0deg,var(--tartan-g) 0 22px,transparent 22px 48px,var(--tartan-r) 48px 56px,transparent 56px 96px);
}
button,input,select{font:inherit}

/* ---------- header: school banner ---------- */
.hdr{position:relative;background:linear-gradient(180deg,#0c1428,#16244a);color:#fff;padding:16px 16px 18px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:linear-gradient(180deg,var(--gold) 0 3px,var(--crimson-d) 3px 7px,var(--gold) 7px 10px)}
.hdr-in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.crest{width:58px;height:66px;flex:0 0 auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.titles{display:flex;flex-direction:column;line-height:1}
.logo{font-family:var(--marker);font-size:clamp(38px,7vw,58px);letter-spacing:2px;color:#fff;transform:rotate(-3deg);transform-origin:left;
  text-shadow:3px 3px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.sub{font-family:var(--marker);font-size:clamp(17px,2.6vw,22px);color:#111;background:var(--bully-y);padding:3px 10px 2px;margin-top:6px;align-self:flex-start;transform:rotate(-1.5deg);box-shadow:3px 3px 0 #000}
.sub span{font-family:var(--ui);font-size:13px;font-weight:600;letter-spacing:.5px;opacity:.8}
.hdr .spacer{flex:1}
.pill{font-family:var(--marker);font-size:15px;color:var(--bully-y);border:2px solid var(--bully-y);padding:4px 12px;border-radius:4px;transform:rotate(2deg);letter-spacing:.5px}
.tag{display:none}

main{max-width:1080px;margin:0 auto;padding:30px 16px 120px}
h2,h3{font-family:var(--marker);font-weight:400;margin:0 0 10px;color:var(--navy);letter-spacing:.3px}
h2{font-size:26px;line-height:1.15}
h3{font-size:20px}
h2 .chip,h3 .chip{vertical-align:middle;font-family:var(--ui);letter-spacing:0}
p{margin:6px 0}
.note{color:var(--ink-soft);font-size:14.5px}

/* ---------- cards: paper / manila ---------- */
.card{position:relative;background:linear-gradient(180deg,var(--paper),var(--paper-2));border-radius:3px;box-shadow:var(--shadow);padding:22px 22px 18px;margin:20px 0;border:1px solid #d9cba5}
.card > h2:first-child,.card > .row:first-child > h2,.card > .row:first-child > .row > h2{display:inline-block;background:linear-gradient(transparent 58%,rgba(255,210,58,.7) 58%,rgba(255,210,58,.7) 92%,transparent 92%);padding:0 4px;margin-left:-4px}
.card.tilt{transform:rotate(-.3deg)}
.card.tilt2{transform:rotate(.25deg)}
.card::before{content:"";position:absolute;top:-14px;left:-8px;width:22px;height:46px;border:3px solid #9aa3b4;border-radius:11px;border-bottom-color:transparent;transform:rotate(14deg);opacity:.9}
.card.notape::before{display:none}
.sticky{background:linear-gradient(180deg,#fff5b8,#ffeb8a);border:none;box-shadow:0 10px 22px rgba(0,0,0,.35)}
.sticky::before{display:none}
.folder{background:linear-gradient(180deg,var(--manila),#ead39c);border-color:var(--manila-d)}
.folder::before{display:none}
.stamp{font-family:var(--marker);font-size:14px;letter-spacing:1px;text-transform:uppercase;color:rgba(181,42,34,.85);border:3px double rgba(181,42,34,.7);padding:2px 8px;transform:rotate(-4deg);white-space:nowrap}

/* drop zone: locker */
.drop{text-align:center;padding:30px 18px;border:3px dashed #8a93a8;border-radius:8px;background:repeating-linear-gradient(90deg,rgba(28,44,82,.04) 0 6px,transparent 6px 12px),#fff;cursor:pointer;transition:.15s}
.drop:hover,.drop.on{border-color:var(--crimson);background:#fffaf0}
.drop .big{font-family:var(--marker);font-size:28px;color:var(--crimson);transform:rotate(-1deg)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:2px solid #0d1630;background:#fff;color:var(--navy);padding:8px 14px;border-radius:4px;cursor:pointer;font-family:var(--marker);font-size:16px;letter-spacing:.3px;line-height:1.15;transition:transform .08s,box-shadow .08s;box-shadow:3px 3px 0 #0d1630}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #0d1630}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 #0d1630}
.btn.red{background:var(--crimson);color:#fff}
.btn.gold{background:var(--gold);color:#1a1405}
.btn.small{font-size:14px;padding:5px 10px;box-shadow:2px 2px 0 #0d1630}
.btn.done{background:#e3f1e7;border-color:var(--green);color:var(--green);box-shadow:2px 2px 0 var(--green)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn:disabled:hover{box-shadow:3px 3px 0 #0d1630}
.btn.done:disabled:hover{box-shadow:2px 2px 0 var(--green)}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.stat{background:#fffdf6;border:2px solid var(--manila-d);border-radius:4px;padding:10px 12px;box-shadow:2px 2px 0 rgba(0,0,0,.08)}
.stat .k{font-size:12.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--marker);font-size:23px;color:var(--navy)}

/* ---------- tabs: folder tabs ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:26px 0 0;position:sticky;top:0;z-index:5;padding:10px 0 0;background:linear-gradient(var(--blazer) 75%,transparent)}
.tab{position:relative;font-family:var(--marker);font-size:16px;letter-spacing:.3px;border:2px solid #0d1630;border-bottom:none;border-radius:8px 8px 0 0;padding:7px 14px 6px;cursor:pointer;background:var(--manila);color:#2b2a24;transform:translateY(4px);box-shadow:inset 0 4px 0 var(--c)}
.tab:hover{transform:translateY(1px)}
.tab.on{background:var(--paper);transform:none;color:var(--navy);box-shadow:inset 0 5px 0 var(--c);z-index:1}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--bully-y);outline-offset:2px}
.panelwrap{border-top:5px solid var(--c);margin-top:0;padding-top:2px}

/* ---------- fields ---------- */
.field{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:11px 0;border-bottom:1px dashed var(--rule)}
.field:last-child{border-bottom:none}
.field .lab{flex:1 1 220px;font-weight:600;font-size:16.5px}
.field .lab small{display:block;font-weight:400;font-size:13.5px;color:var(--muted);margin-top:1px}
input[type=number],input[type=text],input[type=search],select{border:2px solid #b9ab86;border-radius:4px;padding:7px 9px;background:#fff;color:var(--ink);min-width:0}
input[type=number]{width:130px}
select{max-width:100%}
input[type=range]{accent-color:var(--crimson);width:min(260px,100%)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--crimson)}
.val{font-family:var(--marker);font-size:20px;color:var(--crimson);min-width:48px;text-align:right}
.bar{height:14px;border-radius:2px;background:#e8dfc6;overflow:hidden;flex:1 1 140px;min-width:120px;border:2px solid #0d1630}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--green),var(--green) 8px,#3a9160 8px,#3a9160 16px)}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:3px;background:#e3f1e7;color:var(--green);border:1px solid #b2d8bf}
.chip.warn{background:#fff1c9;color:#7a5200;border-color:#e9c66b}
.chip.red{background:#fde4e1;color:var(--crimson-d);border-color:#efb1aa}
p.chip{display:block;width:fit-content;max-width:100%}

/* respect meters */
.factions .field .lab{display:flex;align-items:center;gap:10px}
.dot{width:16px;height:16px;border-radius:3px;display:inline-block;border:2px solid #0d1630}
.meter{position:relative;flex:1 1 260px;display:flex;align-items:center;gap:10px}
.meter input[type=range]{width:100%;flex:1}

/* ---------- toast: big yellow "mission passed" text ---------- */
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) rotate(-2deg) scale(.9);font-family:var(--marker);font-size:clamp(22px,4vw,30px);color:var(--bully-y);letter-spacing:1px;text-align:center;
  text-shadow:3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 0 18px rgba(0,0,0,.6);z-index:20;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) rotate(-2deg) scale(1)}

.changes{font-size:15.5px;margin:6px 0 0;padding-left:22px}
.changes li{margin:3px 0}
.changes li.risky{color:#7a5200}

/* ---------- save bar ---------- */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(180deg,#16244a,#0c1428);border-top:4px solid var(--gold);box-shadow:0 -6px 18px rgba(0,0,0,.35)}
.savebar .note{font-family:var(--marker);font-size:15px;color:#e9e3cf}

/* weapons */
.weap{display:grid;grid-template-columns:28px 1fr auto;gap:8px 10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--rule)}
.weap:last-child{border-bottom:none}
.weap .nm{font-weight:600;font-size:16px}
.weap .nm small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.weap .amt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.weap input[type=number]{width:76px}

/* steps */
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0 0}
.steps li{counter-increment:s;position:relative;padding:5px 0 5px 42px;font-size:16px}
.steps li::before{content:counter(s);position:absolute;left:0;top:3px;width:30px;height:30px;border-radius:3px;background:var(--crimson);color:#fff;display:grid;place-items:center;font-family:var(--marker);font-size:16px;transform:rotate(-4deg);box-shadow:2px 2px 0 #000}
.tips{margin:6px 0 0;padding-left:20px}
.tips li{margin:6px 0;line-height:1.45}
.tips b{font-weight:700}

.err{background:#fde4e1;border:2px solid #e9a39b;color:var(--crimson-d);padding:10px 12px;border-radius:4px;font-weight:600}
.ok{background:#e3f1e7;border:2px solid #9fcdb0;color:var(--green);padding:10px 12px;border-radius:4px;font-weight:600}
.hidden{display:none!important}
footer{max-width:1080px;margin:0 auto;padding:0 16px 40px;color:#aab3c9;font-size:13px}

/* ---------- report card (classes) ---------- */
.report{position:relative;background:radial-gradient(ellipse at 20% 0,#24407e,#142a5c 60%,#0f2149);color:#f4efe0;border-radius:4px;padding:18px 20px 22px;box-shadow:var(--shadow);border:3px solid #0b1838;outline:2px solid var(--gold);outline-offset:-10px}
.report-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;font-family:var(--marker);font-size:28px;color:var(--gold);padding:4px 10px 8px;border-bottom:2px solid var(--gold);margin:0 4px 8px}
.report-note{font-size:14px;opacity:.85;margin:6px 10px 10px}
.report-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px 44px;padding:6px 10px}
.rc-name{font-family:var(--marker);font-size:20px;margin-bottom:4px;letter-spacing:.3px}
.rc-boxes{display:flex;gap:4px}
.rc-box{width:44px;height:38px;border:2px solid #f4efe0;background:rgba(255,255,255,.06);color:#46d36c;font-size:30px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;font-weight:700;transition:background .1s}
.rc-box:hover{background:rgba(255,255,255,.16)}
.rc-box.on{background:rgba(70,211,108,.08);text-shadow:0 1px 0 #0b3d1a}
.rc-box:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.rc-reward{font-size:13px;opacity:.85;margin-top:5px;min-height:1.4em}
.rc-reward b{color:var(--gold);font-weight:600}
.rc-list{margin:12px 10px 0;padding:10px 12px;border-top:1px dashed rgba(242,181,28,.6);font-size:13.5px}
.rc-list summary{cursor:pointer;color:var(--gold);font-family:var(--marker);font-size:16px}
.rc-list table{border-collapse:collapse;margin-top:8px;width:100%}
.rc-list td,.rc-list th{padding:4px 8px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left;vertical-align:top}
.rc-list th{color:var(--gold);font-weight:600;white-space:nowrap}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(6,10,22,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow:auto;margin:0;transform:none!important;background:linear-gradient(180deg,#fffbe0,#fff2b0);border:3px solid #0d1630}
.modal::before{display:none}
.modal h2{color:var(--crimson-d)}
.statlist .field{padding:6px 0}
input[type=search]{font:inherit;box-sizing:border-box}

@media(max-width:560px){
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
  .tab{white-space:nowrap;flex:0 0 auto}
  .card{padding:18px 14px}
  .card.tilt,.card.tilt2{transform:none}
  .field .lab{flex-basis:100%}
  .savebar .note{display:none}
  .savebar .btn{flex:1;justify-content:center}
  .rc-box{width:15vw;max-width:46px}
  .report-grid{gap:14px}
  .pill{display:none}
  .crest{width:46px;height:52px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.statlist{max-height:560px;overflow:auto;padding-right:8px;border:2px solid var(--rule);border-radius:4px;padding-left:12px;background:#fffdf6}
</style>
</head>

      listBox.appendChild(row);
    });
    sc.appendChild(filt); sc.appendChild(listBox); applyFilter();
    w.appendChild(sc);
  }

  /* ---------------------------------------------------------- change list */
  function changeList() {
    if (!S) return [];
    var s = sv(), o = new Core.BullySave(S.orig), out = [];
    if (getMoney(s.b) !== getMoney(o.b)) out.push('Money: ' + money(getMoney(o.b)) + ' → ' + money(getMoney(s.b)));
    if (s.u32(cloth(s).hair) !== o.u32(cloth(o).hair)) { var hn = hairName(s), hx = HAIRS.filter(function (x) { return x.name === hn; })[0]; out.push('Haircut: ' + (hx ? hx.label : 'changed')); }
    if (Math.round(s.f32(0x20)) !== Math.round(o.f32(0x20))) out.push('Health: ' + Math.round(o.f32(0x20)) + ' → ' + Math.round(s.f32(0x20)));
    if (Math.round(s.f32(0x24)) !== Math.round(o.f32(0x24))) out.push('Max health: ' + Math.round(o.f32(0x24)) + ' → ' + Math.round(s.f32(0x24)));
    CLIQUES.forEach(function (c) { var a = o.u32(respectOff(c[0])), b = s.u32(respectOff(c[0])); if (a !== b) out.push(c[1] + ' respect: ' + a + ' → ' + b); });
    CLASSES.forEach(function (n, i) { var a = o.u32(classOff(i)), b = s.u32(classOff(i)); if (a !== b) out.push(n + ' class: level ' + a + ' → ' + b); });
    var ca = clothesOwned(o), cb = clothesOwned(s); if (ca !== cb) out.push('Clothing items: ' + ca + ' → ' + cb);
    var oa = outfitsUnlocked(o), ob = outfitsUnlocked(s); if (oa !== ob) out.push('Outfits unlocked: ' + oa + ' → ' + ob);
    WEAPONS.forEach(function (x) { var a = weaponAmt(o, x[0]), b = weaponAmt(s, x[0]); if (a !== b) out.push(x[1] + ': ' + (b ? (x[2] > 1 ? b : 'added') : 'removed')); });
    ITEMS.forEach(function (x) { var a = o.u32(itemOff(o, x[0])), b = s.u32(itemOff(s, x[0])); if (a !== b) out.push(x[1] + ': ' + a + ' → ' + b); });
    COLLECT.forEach(function (x) { var a = collected(o, x[1], x[2]), b = collected(s, x[1], x[2]); if (a !== b) out.push(x[0] + ': ' + a + ' → ' + b); });
    var ha = hoboCount(o), hb = hoboCount(s); if (ha !== hb) out.push('Hobo lessons: ' + ha + ' → ' + hb);
    var ea = errandsDone(o), eb = errandsDone(s); if (ea !== eb) out.push('Errands done: ' + ea + ' → ' + eb);
    var da = doorStats(o).locked, db = doorStats(s).locked; if (da !== db) out.push('Locked doors: ' + da + ' → ' + db);
    [0, 1].forEach(function (k) { if (bikeSlot(s, k) !== bikeSlot(o, k)) out.push('Garage spot ' + (k + 1) + ': ' + bikeName(bikeSlot(o, k)) + ' → ' + bikeName(bikeSlot(s, k))); });
    return out.concat(riskyChanges().map(function (x) { return x + ' (untested)'; }));
  }
  function riskyChanges() {
    if (!S) return [];
    var s = sv(), o = new Core.BullySave(S.orig), out = [];
    var hp = s.f32(0x20), mh = s.f32(0x24);
    if ((hp > GOD_HP && hp !== o.f32(0x20)) || (mh > GOD_HP && mh !== o.f32(0x24))) out.push('Health or max health above ' + GOD_HP.toLocaleString('en-US'));
    EXTRA_WEAPONS.forEach(function (x) { var a = weaponAmt(o, x[0]), b = weaponAmt(s, x[0]); if (a !== b) out.push(x[1] + ': ' + (b ? (x[2] > 1 ? b : 'added') : 'removed')); });
    MISSION_ITEMS.forEach(function (x) { var a = o.u32(itemOff(o, x[0])), b = s.u32(itemOff(s, x[0])); if (a !== b) out.push(x[1] + ': ' + a + ' → ' + b); });
    if (s.u32(0x58) !== o.u32(0x58) || s.u32(0x5c) !== o.u32(0x5c)) out.push('Time of day: ' + pad2(o.u32(0x58)) + ':' + pad2(o.u32(0x5c)) + ' → ' + pad2(s.u32(0x58)) + ':' + pad2(s.u32(0x5c)));
    if (s.u32(0x68) !== o.u32(0x68) || s.u32(0x6c) !== o.u32(0x6c) || s.u32(0x70) !== o.u32(0x70)) out.push('Play time: ' + o.u32(0x68) + 'h ' + pad2(o.u32(0x6c)) + 'm ' + pad2(o.u32(0x70)) + 's → ' + s.u32(0x68) + 'h ' + pad2(s.u32(0x6c)) + 'm ' + pad2(s.u32(0x70)) + 's');
    if (S.recOff != null) { var d0 = ftDateStr(ftOrigU32), d1 = ftDateStr(ftU32); if (d0 !== d1) out.push('Load-screen date: ' + d0 + ' → ' + d1); }
    STATS.forEach(function (x) { if (x[0] === 2 && (s.u32(0x68) !== o.u32(0x68) || s.u32(0x6c) !== o.u32(0x6c) || s.u32(0x70) !== o.u32(0x70))) return;
      var a = getStat(o, x[0]), b = getStat(s, x[0]); if (a !== b) out.push('Stat "' + x[1] + '": ' + fmtStat(x[0], a) + ' → ' + fmtStat(x[0], b)); });
    return out;
  }

  /* --------------------------------------------------------------- export */
  function buildCard() {
    var s = sv();
    s.fixChecksum();
    var fname = S.ent.name, mc = new Core.MemCard(S.card.orig, S.name);
    mc.writeFile(mc.findFile(S.dir, fname), s.b);
    var ftChanged = S.ft && !Core.u8eq(S.ft, S.ftOrig);
    if (ftChanged) mc.writeFile(mc.findFile(S.dir, 'FileTableBully'), S.ft);
    var chk = new Core.MemCard(mc.raw), back = new Core.BullySave(chk.readFile(chk.findFile(S.dir, fname)));
    if (ftChanged && !Core.u8eq(chk.readFile(chk.findFile(S.dir, 'FileTableBully')), S.ft)) throw new Error('Self-check failed, so nothing was exported. Your save wasn’t touched - please try again or report this.');
    if (!Core.u8eq(back.b, s.b) || !back.checksumOk() || chk.eccReport().bad) throw new Error('Self-check failed, so nothing was exported. Your save wasn’t touched - please try again or report this.');
    S.exported = true;
    return mc.raw;
  }
  function riskyDialog(list, proceed) {
    var prev = document.activeElement;
    var ov = el('div', { cls: 'modal-bg', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'rk-h' });
    function close() { ov.remove(); document.removeEventListener('keydown', esc); if (prev && prev.focus) prev.focus(); }
    function esc(e) { if (e.key === 'Escape') close(); }
    var goBtn = el('button', { cls: 'btn red', onclick: function () { close(); proceed(); } }, 'Export anyway');
    ov.appendChild(el('div', { cls: 'modal card notape' },
      el('h2', { id: 'rk-h' }, '⚠ This save might not load'),
      el('p', null, 'These changes haven’t been tested on a PS4. There’s a chance the game says "Load failed! Data may be corrupted" or acts strangely:'),
      el('ul', { cls: 'changes' }, list.map(function (t) { return el('li', null, t); })),
      el('p', { cls: 'note' }, 'Keep a backup of your original save. If it won’t load, undo these on the Untested tab and export again.'),
      el('div', { cls: 'row', style: 'margin-top:12px;justify-content:flex-end' },
        el('button', { cls: 'btn', onclick: close }, 'Go back'), goBtn)));
    ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
    document.addEventListener('keydown', esc);
    document.body.appendChild(ov); goBtn.focus();
  }
  function download(blob, name) { var a = el('a', { href: URL.createObjectURL(blob), download: name }); document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
  function pSave(w, s) {
    var list = changeList();
    var c = card('', el('h2', null, 'Save & export'));
    var risky = riskyChanges();
    if (!list.length) c.appendChild(el('p', null, 'No changes yet - pick something in the other tabs (or hit "Max out everything").'));
    else { c.appendChild(el('p', null, 'You’re about to save these changes:')); c.appendChild(el('ul', { cls: 'changes' }, list.map(function (t) { return el('li', { cls: / \(untested\)$/.test(t) ? 'risky' : null }, t); }))); }
    if (risky.length) c.appendChild(el('p', { cls: 'chip warn', style: 'margin-top:8px' }, risky.length + ' untested change' + (risky.length > 1 ? 's' : '') + ' - the save might not load. You’ll get a reminder before it downloads.'));
    var msg = el('div');
    function go(asZip) {
      if (risky.length) return riskyDialog(risky, function () { doExport(asZip); });
      doExport(asZip);
    }
    function doExport(asZip) {
      msg.innerHTML = '';
      try {
        var raw = buildCard();
        if (asZip) {
          var files = S.zip.map(function (f) { return { name: f.name, raw: /(^|\/)VMC0\.card$/i.test(f.name) ? raw : f.raw }; });
          download(writeZip(files), S.name.replace(/\.zip$/i, '') + '_edited.zip');
        } else download(new Blob([raw], { type: 'application/octet-stream' }), 'VMC0.card');
        msg.appendChild(el('div', { cls: 'ok', style: 'margin-top:12px' }, 'Done! Checksum updated and verified. Now re-encrypt the downloaded ' + (asZip ? 'zip' : 'VMC0.card') + ' with your save tool and copy it to your PS4.'));
      } catch (e) { msg.appendChild(el('div', { cls: 'err', style: 'margin-top:12px' }, e.message)); }
    }
    var btns = el('div', { cls: 'row', style: 'margin-top:14px' });
    if (S.zip) btns.appendChild(el('button', { cls: 'btn red', disabled: list.length ? null : 'disabled', onclick: function () { go(true); } }, '⬇ Download edited save zip'));
    btns.appendChild(el('button', { cls: 'btn' + (S.zip ? '' : ' red'), disabled: list.length ? null : 'disabled', onclick: function () { go(false); } }, '⬇ Download VMC0.card only'));
    btns.appendChild(el('button', { cls: 'btn small', disabled: list.length ? null : 'disabled', onclick: function () { if (confirm('Undo all changes?')) { S.save.b.set(S.orig); if (S.ft) S.ft.set(S.ftOrig); render(); toast('All changes undone'); } } }, 'Undo all'));
    c.appendChild(btns); c.appendChild(msg);
    w.appendChild(c);
    w.appendChild(card('sticky tilt2 notape', el('h3', null, 'Getting it back on your PS4'),
      el('ol', { cls: 'steps' },
        el('li', null, S.zip ? 'Upload the downloaded zip to your save tool (garlicsaves) to encrypt it.' : 'Put the downloaded VMC0.card back into your decrypted save folder (replace the old one), then encrypt it with your save tool.'),
        el('li', null, 'Copy the encrypted save to your PS4 and load it in Bully.'),
        el('li', null, 'Rewards for things you unlocked (trophies in Jimmy’s room, errand trophies) are handed out by the game when the save loads.')),
      el('p', { cls: 'note' }, 'VMC1.card is always an empty spare memory card - leave it as it is.')));
  }

  window.addEventListener('DOMContentLoaded', function () {
    $('#saveBtn').addEventListener('click', function () { tab = 'save'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    document.addEventListener('dragover', function (e) { e.preventDefault(); });
    window.addEventListener('beforeunload', function (e) { if (S && changeList().length && !S.exported) { e.preventDefault(); e.returnValue = ''; } });
    var v = $('#ver'); if (v) v.textContent = 'v' + VERSION;
    document.addEventListener('drop', function (e) { e.preventDefault(); if (!S && e.dataTransfer.files[0]) load(e.dataTransfer.files[0]); });
    render();
  });
  window.BullyApp = { load: load, get S() { return S; } };
})();
